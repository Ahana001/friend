<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coconut Drop Animation with Surprise</title>
<style>
  body {
    margin: 0;
    padding: 0;
    height: 100vh;
    overflow: hidden;
    background: #87CEEB;
    font-family: Arial, sans-serif;
  }

  .tree {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: url('./img/tree.webp') no-repeat bottom center;
    background-size: cover;
  }

  .coconut-container {
    position: absolute;
    top: 100px;
    left: 300px;
    width: 200px;
    height: 200px;
    z-index: 10;
    transition: top 2s cubic-bezier(0.25, 0.8, 0.25, 1);
  }

  .coconut {
    position: absolute;
    width: 0;
    height: 0;
    opacity: 0;
    animation: growCoconut 3s forwards;
    animation-delay: 1s;
  }

  .half {
    position: absolute;
    width: 100px;
    height: 150px;
    top: 50%;
    left: 30%;
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: transform 1s ease, opacity 1s ease;
  }

  .gift {
    position: absolute; /* relative to body */
    top: 50%; /* initial drop start (same as container) */
    left: 50%;
    transform: translateX(-50%) scale(0.5); /* start small */
    opacity: 0;
    transition: top 2s ease, transform 2s ease, opacity 1s ease;
    z-index: 20;
    max-width: 150px;  /* adjust if needed */
    max-height: 150px; /* adjust if needed */
    width: auto;       /* keep natural aspect ratio */
    height: auto;      /* keep natural aspect ratio */
}

  .surprise {
    display: none;
    position: fixed; /* so it stays relative to viewport */
    top: 20px;       /* near the top */
    left: 50%;
    transform: translateX(-50%);
    font-size: 3rem;
    color: #FFD700; /* gold color */
    font-weight: bold;
    text-shadow: 2px 2px 5px #0066ff, 1px 1px 3px #ff69b4; /* red & pink shadows */
    text-align: center;
    animation: popIn 1s ease forwards;
    z-index: 200;
  }

  @keyframes growCoconut {
    0% { width: 0; height: 0; opacity: 0; }
    100% { width: 200px; height: 200px; opacity: 1; }
  }

  /* Floating Music Button */
.music-controls {
  position: fixed;
  bottom: 30px;
  right: 30px;
  z-index: 100;
}

.fab-music {
  width: 60px;
  height: 60px;
  background: #3b82f6; /* primary color */
  border: none;
  border-radius: 50%;
  color: white;
  font-size: 24px;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(59, 130, 246, 0.4);
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.fab-music:hover {
  transform: scale(1.1) rotate(15deg);
}

.fab-music.playing {
  animation: musicPulse 1.5s infinite;
}

@keyframes popIn {
    0% {
        transform: translateX(-50%) scale(0.5);
        opacity: 0;
    }
    50% {
        transform: translateX(-50%) scale(1.2);
        opacity: 1;
    }
    100% {
        transform: translateX(-50%) scale(1);
        opacity: 1;
    }
}

@keyframes musicPulse {
  0% {
    box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7);
  }
  70% {
    box-shadow: 0 0 0 20px rgba(59, 130, 246, 0);
  }
  100% {
    box-shadow: 0 0 0 0 rgba(59, 130, 246, 0);
  }
}
</style>
</head>
<body>

<div class="tree"></div>

<div class="coconut-container" id="container">
    <img src="./img/whole.png" class="coconut" id="coconut">
    <img src="./img/half1.png" class="half" id="piece1">
    <img src="./img/half2.png" class="half" id="piece2">
    <img src="./img/pic.jpeg" class="gift" id="gift"> <!-- gift comes from coconut -->
</div>

<div class="music-controls">
  <button class="fab-music" id="musicBtn">🎵</button>
</div>

<audio id="bgMusic">
  <source src="./song.mp3" type="audio/mpeg">
</audio>

<div class="surprise" id="surprise">🎉 Happy Birthday! 🎉</div>

<script>
const container = document.getElementById('container');
const coconut = document.getElementById('coconut');
const piece1 = document.getElementById('piece1');
const piece2 = document.getElementById('piece2');
const gift = document.getElementById('gift');
const surprise = document.getElementById('surprise');
const musicBtn = document.getElementById('musicBtn');
const bgMusic = document.getElementById('bgMusic');


// Step 1: Coconut grows, then drop
coconut.addEventListener('animationend', () => {
    setTimeout(() => {
        container.style.top = '400px'; // drop
    }, 500);
});

// Step 2: After container drops, split coconut
// After coconut splits
container.addEventListener('transitionend', (e) => {
    if (e.propertyName !== 'top') return; // ensure container finished dropping

    coconut.style.display = 'none';

    // Split halves
    piece1.style.opacity = '1';
    piece1.style.transform = 'translate(-50px, -30px) rotate(-30deg)';

    piece2.style.opacity = '1';
    piece2.style.transform = 'translate(50px, -30px) rotate(30deg)';

    // Step 3: Place gift between halves
    setTimeout(() => {
          // Position gift at container center (between halves)
    gift.style.position = 'absolute'; // relative to container
    gift.style.top = '30%';
    gift.style.left = '50%';
    gift.style.opacity = '1'; // reveal gift now
    gift.style.transform = 'translate(-50%, -50%) scale(0.5) rotate(0deg)';
    gift.style.transition = 'top 3s ease, transform 3s ease, opacity 1s ease';

    // Step 3a: Rise to top
    requestAnimationFrame(() => {
        gift.style.top = '-50px'; // move above the halves
        gift.style.transform = 'translate(-50%, -50%) scale(2) rotate(0deg)';
    });


        // Step 3b: Rotate after rise completes
        setTimeout(() => {
            gift.style.transition = 'transform 2s ease'; // rotate-only transition
            gift.style.transform = 'translate(-50%, -50%) scale(1) rotate(720deg)'; // 2 full rotations
        }, 3000); // wait until rise (3s) finishes

        // Step 4: Show surprise text after rotation finishes
        setTimeout(() => {
            surprise.style.display = 'block';
        }, 5000); // 3s rise + 2s rotation
    }, 500);
});


// Function to start music and pulse button
function startMusic() {
    bgMusic.play().then(() => {
        musicBtn.classList.add('playing'); // start pulse effect
    }).catch(err => {
        console.log("Autoplay failed:", err);
    });
}

// Attempt to autoplay on page load
window.addEventListener('load', () => {
    startMusic();
});

// Button click toggle (still works)
musicBtn.addEventListener('click', () => {
    if (bgMusic.paused) {
        startMusic();
    } else {
        bgMusic.pause();
        musicBtn.classList.remove('playing');
    }
});

bgMusic.addEventListener('ended', () => {
    musicBtn.classList.remove('playing'); // stop pulse animation
});

</script>

</body>
</html>
