<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coconut Surprise 🎉</title>

<style>
body {
  margin: 0;
  padding: 0;
  height: 100vh;
  overflow: hidden;
  background: #87CEEB;
  font-family: Arial, sans-serif;
}

/* 🌴 Background */
.tree {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: url('./img/tree.webp') no-repeat left bottom;
  background-size: cover;
}

/* 🥥 Main container */
.coconut-container {
  position: absolute;
  top: 10vh;
  left: 50%;
  transform: translateX(-50%);
  width: clamp(140px, 40vw, 220px);
  aspect-ratio: 1 / 1;
  z-index: 10;
  transition: top 2s cubic-bezier(0.25, 0.8, 0.25, 1);
}

.coconut, .half, .gift {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: contain;
  top: 0;
  left: 0;
}

.coconut {
  opacity: 0;
  animation: growCoconut 3s forwards;
  animation-delay: 1s;
}

.half {
  width: 70%;
  height: 70%;
  top: 15%;
  left: 15%;
  opacity: 0;
  transition: transform 1s ease, opacity 1s ease;
}

.gift {
  opacity: 0;
  transform: scale(0.5);
  z-index: 20;
  transition: all 2s ease;
}

/* 🎉 Text */
.surprise {
  display: none;
  position: fixed;
  top: 30%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: clamp(1.8rem, 5vw, 3rem);
  color: #FFD700;
  font-weight: bold;
  text-align: center;
  text-shadow: 2px 2px 5px #0066ff, 1px 1px 3px #ff69b4;
  z-index: 200;
  animation: popIn 1s ease forwards;
}

/* 🎵 Music */
.music-controls {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 100;
}

.fab-music {
  width: 50px;
  height: 50px;
  background: #3b82f6;
  border: none;
  border-radius: 50%;
  color: white;
  font-size: 20px;
  cursor: pointer;
}

.fab-music.playing {
  animation: musicPulse 1.5s infinite;
}

/* ✨ Sparkles */
#sparkles {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 150;
}

.sparkle {
  position: absolute;
  border-radius: 50%;
  opacity: 0;
  animation: sparkleAnim linear forwards;
}

@keyframes sparkleAnim {
  0% {
    transform: scale(0) translateY(0);
    opacity: 1;
  }
  50% {
    transform: scale(1.5) translateY(-50px);
    opacity: 1;
  }
  100% {
    transform: scale(0.3) translateY(-120px);
    opacity: 0;
  }
}

/* animations */
@keyframes growCoconut {
  0% { transform: scale(0); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

@keyframes popIn {
  0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
  100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}

@keyframes musicPulse {
  0% { box-shadow: 0 0 0 0 rgba(59,130,246,0.7); }
  70% { box-shadow: 0 0 0 20px rgba(59,130,246,0); }
  100% { box-shadow: 0 0 0 0 rgba(59,130,246,0); }
}
</style>
</head>

<body>

<div class="tree"></div>

<div class="coconut-container" id="container">
  <img src="./img/whole.png" class="coconut" id="coconut">
  <img src="./img/half1.png" class="half" id="piece1">
  <img src="./img/half2.png" class="half" id="piece2">
  <img src="./img/pic.jpeg" class="gift" id="gift">
</div>

<div class="music-controls">
  <button class="fab-music" id="musicBtn">🎵</button>
</div>

<div id="sparkles"></div>

<audio id="bgMusic">
  <source src="./song.mp3" type="audio/mpeg">
</audio>

<div class="surprise" id="surprise">🎉 Happy Birthday 🎉</div>

<script>
const container = document.getElementById('container');
const coconut = document.getElementById('coconut');
const piece1 = document.getElementById('piece1');
const piece2 = document.getElementById('piece2');
const gift = document.getElementById('gift');
const surprise = document.getElementById('surprise');
const musicBtn = document.getElementById('musicBtn');
const bgMusic = document.getElementById('bgMusic');
const sparklesContainer = document.getElementById('sparkles');

/* Coconut animation */
coconut.addEventListener('animationend', () => {
  setTimeout(() => container.style.top = '65vh', 500);
});

container.addEventListener('transitionend', (e) => {
  if (e.propertyName !== 'top') return;

  coconut.style.display = 'none';

  piece1.style.opacity = '1';
  piece1.style.transform = 'translate(-70%, -30%) rotate(-35deg)';

  piece2.style.opacity = '1';
  piece2.style.transform = 'translate(70%, -30%) rotate(35deg)';

  setTimeout(() => {
    gift.style.opacity = '1';
    gift.style.transform = 'translate(0, -120%) scale(1.2)';

    setTimeout(() => {
      gift.style.transform = 'translate(0, -120%) scale(1.1) rotate(720deg)';
    }, 2000);

    setTimeout(() => {
      surprise.style.display = 'block';

      createSparkles(300);   // 💥 BIG BURST
      startSparkleRain();    // 🌧 CONTINUOUS

    }, 4000);

  }, 500);
});

/* 🎵 Music */
function startMusic() {
  bgMusic.play().then(() => {
    musicBtn.classList.add('playing');
  }).catch(() => {});
}

window.addEventListener('load', startMusic, { once: true });

musicBtn.addEventListener('click', () => {
  if (bgMusic.paused) startMusic();
  else {
    bgMusic.pause();
    musicBtn.classList.remove('playing');
  }
});

/* ✨ Sparkle logic */
const colors = ['#FFD700','#FFFFFF','#FF69B4','#00FFFF','#FFA500'];

function createSparkles(count) {
  for (let i = 0; i < count; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';

    const size = Math.random() * 6 + 4;
    s.style.width = size + 'px';
    s.style.height = size + 'px';

    s.style.background =
      `radial-gradient(circle, ${colors[Math.floor(Math.random()*colors.length)]}, transparent)`;

    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';

    s.style.animationDuration = (Math.random()*1.5+1)+'s';

    sparklesContainer.appendChild(s);
    setTimeout(() => s.remove(), 2500);
  }
}

function startSparkleRain() {
  const interval = setInterval(() => {
    createSparkles(80);
  }, 300);

  setTimeout(() => clearInterval(interval), 6000);
}
</script>

</body>
</html>
