<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coconut Surprise 🎉</title>

<style>
body {
  margin: 0;
  padding: 0;
  height: 100vh;
  overflow: hidden;
  background: #87CEEB;
  font-family: Arial, sans-serif;
}

/* Background */
.tree {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 100%;
  background: url('./img/tree.webp') no-repeat bottom center;
  background-size: cover;
}

/* Coconut container */
.coconut-container {
  position: absolute;
  top: 10vh;
  left: 50%;
  transform: translateX(-50%);
  width: 45vw;
  height: 45vw;
  max-width: 220px;
  max-height: 220px;
  z-index: 10;
  transition: top 2s cubic-bezier(0.25, 0.8, 0.25, 1);
  overflow: visible;
}

/* ALL images responsive */
.coconut, .half, .gift {
  width: 100%;
  height: auto;
  object-fit: contain;
  display: block;
}

/* Coconut animation */
.coconut {
  opacity: 0;
  animation: growCoconut 3s forwards;
  animation-delay: 1s;
}

/* Coconut halves */
.half {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  opacity: 0;
  transition: transform 1s ease, opacity 1s ease;
}

/* Gift */
.gift {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.5);
  opacity: 0;
  z-index: 20;
  width: 35vw;
  max-width: 150px;
  transition: all 3s ease;
}

/* Text */
.surprise {
  display: none;
  position: fixed;
  top: 5vh;
  left: 50%;
  transform: translateX(-50%);
  font-size: clamp(1.5rem, 5vw, 3rem);
  color: #FFD700;
  font-weight: bold;
  text-align: center;
  text-shadow: 2px 2px 5px #0066ff, 1px 1px 3px #ff69b4;
  z-index: 200;
  animation: popIn 1s ease forwards;
}

/* Music button */
.music-controls {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 100;
}

.fab-music {
  width: 50px;
  height: 50px;
  background: #3b82f6;
  border: none;
  border-radius: 50%;
  color: white;
  font-size: 20px;
  cursor: pointer;
}

.fab-music.playing {
  animation: musicPulse 1.5s infinite;
}

/* Animations */
@keyframes growCoconut {
  0% { transform: scale(0); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

@keyframes popIn {
  0% { transform: translateX(-50%) scale(0.5); opacity: 0; }
  100% { transform: translateX(-50%) scale(1); opacity: 1; }
}

@keyframes musicPulse {
  0% { box-shadow: 0 0 0 0 rgba(59,130,246,0.7); }
  70% { box-shadow: 0 0 0 20px rgba(59,130,246,0); }
  100% { box-shadow: 0 0 0 0 rgba(59,130,246,0); }
}

/* Extra mobile safety */
@media (max-width: 480px) {
  .coconut-container {
    width: 60vw;
    height: 60vw;
    top: 8vh;
  }

  .gift {
    width: 45vw;
  }
}
</style>
</head>

<body>

<div class="tree"></div>

<div class="coconut-container" id="container">
  <img src="./img/whole.png" class="coconut" id="coconut">
  <img src="./img/half1.png" class="half" id="piece1">
  <img src="./img/half2.png" class="half" id="piece2">
  <img src="./img/pic.jpeg" class="gift" id="gift">
</div>

<div class="music-controls">
  <button class="fab-music" id="musicBtn">🎵</button>
</div>

<audio id="bgMusic">
  <source src="./song.mp3" type="audio/mpeg">
</audio>

<div class="surprise" id="surprise">🎉 Happy Birthday! 🎉</div>

<script>
const container = document.getElementById('container');
const coconut = document.getElementById('coconut');
const piece1 = document.getElementById('piece1');
const piece2 = document.getElementById('piece2');
const gift = document.getElementById('gift');
const surprise = document.getElementById('surprise');
const musicBtn = document.getElementById('musicBtn');
const bgMusic = document.getElementById('bgMusic');

/* Step 1: grow → drop */
coconut.addEventListener('animationend', () => {
  setTimeout(() => {
    container.style.top = '60vh';
  }, 500);
});

/* Step 2: split */
container.addEventListener('transitionend', (e) => {
  if (e.propertyName !== 'top') return;

  coconut.style.display = 'none';

  /* proportional movement */
  piece1.style.opacity = '1';
  piece1.style.transform = 'translate(-80%, -60%) rotate(-30deg)';

  piece2.style.opacity = '1';
  piece2.style.transform = 'translate(80%, -60%) rotate(30deg)';

  /* Step 3: gift */
  setTimeout(() => {
    gift.style.opacity = '1';

    requestAnimationFrame(() => {
      gift.style.top = '-20%';
      gift.style.transform = 'translate(-50%, -50%) scale(1.4)';
    });

    /* rotate */
    setTimeout(() => {
      gift.style.transition = 'transform 2s ease';
      gift.style.transform = 'translate(-50%, -50%) scale(1.2) rotate(720deg)';
    }, 3000);

    /* text */
    setTimeout(() => {
      surprise.style.display = 'block';
    }, 5000);

  }, 500);
});

/* Music */
function startMusic() {
  bgMusic.play().then(() => {
    musicBtn.classList.add('playing');
  }).catch(() => {});
}

window.addEventListener('load', startMusic);

musicBtn.addEventListener('click', () => {
  if (bgMusic.paused) {
    startMusic();
  } else {
    bgMusic.pause();
    musicBtn.classList.remove('playing');
  }
});

bgMusic.addEventListener('ended', () => {
  musicBtn.classList.remove('playing');
});
</script>

</body>
</html>
